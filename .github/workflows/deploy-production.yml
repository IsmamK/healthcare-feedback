name: Production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build both images even if source is unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: healthcare-feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Backend tests and migration consistency
        run: |
          pip install -r backend/requirements.txt
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py test api
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Release planning, shell and Compose checks
        run: bash deploy/scripts/check.sh
  deploy:
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.PRODUCTION_AUTO_DEPLOY == 'true'))
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT_ROOT: /opt/healthcare-feedback
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME || vars.DOCKER_HUB_USERNAME }}
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN || 'feedback.jghealthcare.com' }}
      API_DOMAIN: ${{ vars.API_DOMAIN || 'feedback.jghealthcare.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Configure strictly verified deployment SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          [[ "$DOCKER_HUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/healthcare-feedback
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/healthcare-feedback-known-hosts
          chmod 600 ~/.ssh/healthcare-feedback*
          cat > ~/.ssh/config <<EOF
          Host healthcare-feedback-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/healthcare-feedback
            UserKnownHostsFile ~/.ssh/healthcare-feedback-known-hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          ssh healthcare-feedback-vps 'test -d /opt/healthcare-feedback/env && test ! -e /opt/healthcare-feedback/transaction.pending'
          ssh healthcare-feedback-vps 'if test -f /opt/healthcare-feedback/current/images.env; then cat /opt/healthcare-feedback/current/images.env; fi' > "$RUNNER_TEMP/previous.env"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Plan changes from the actual deployed release
        id: plan
        env:
          PREVIOUS_RELEASE: ${{ runner.temp }}/previous.env
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: python3 deploy/scripts/plan-builds.py
      - name: Build and push backend
        if: steps.plan.outputs.backend == 'true'
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/healthcare-feedback-backend:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=healthcare-feedback-backend
          cache-to: type=gha,mode=max,scope=healthcare-feedback-backend
      - name: Build and push frontend
        if: steps.plan.outputs.frontend == 'true'
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/healthcare-feedback-frontend:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=healthcare-feedback-frontend
          cache-to: type=gha,mode=max,scope=healthcare-feedback-frontend
      - name: Stage and deploy immutable release
        if: steps.plan.outputs.deploy == 'true'
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          PREVIOUS_BACKEND: ${{ steps.plan.outputs.previous_backend }}
          PREVIOUS_FRONTEND: ${{ steps.plan.outputs.previous_frontend }}
        run: |
          set -Eeuo pipefail
          backend="${PREVIOUS_BACKEND}"
          frontend="${PREVIOUS_FRONTEND}"
          if [[ -n "$BACKEND_DIGEST" ]]; then backend="$DOCKER_HUB_USERNAME/healthcare-feedback-backend@$BACKEND_DIGEST"; fi
          if [[ -n "$FRONTEND_DIGEST" ]]; then frontend="$DOCKER_HUB_USERNAME/healthcare-feedback-frontend@$FRONTEND_DIGEST"; fi
          printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\nGIT_SHA=%s\nCI_RUN_ID=%s\nCI_RUN_ATTEMPT=%s\n' \
            "$backend" "$frontend" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > deploy/images.env
          python3 deploy/scripts/validate-release.py deploy/images.env
          release="$PROJECT_ROOT/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh healthcare-feedback-vps "mkdir -m 700 '$release'"
          # Copy only reviewed operational files. Never transfer runtime env files or application source.
          tar -C deploy -czf "$RUNNER_TEMP/release.tar.gz" compose.yml scripts images.env \
            env/backend.env.example env/database.env.example env/frontend.env.example env/site.env.example env/backup.env.example
          scp "$RUNNER_TEMP/release.tar.gz" "healthcare-feedback-vps:$release/bundle.tar.gz"
          ssh healthcare-feedback-vps "tar -xzf '$release/bundle.tar.gz' -C '$release' && bash '$release/scripts/release.sh' '$release'"
          python3 deploy/scripts/verify.py "$FRONTEND_DOMAIN" "$API_DOMAIN"
          printf 'Verified release: %s\nBackend: %s\nFrontend: %s\n' "$GITHUB_SHA" "$backend" "$frontend" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/healthcare-feedback ~/.ssh/healthcare-feedback-known-hosts ~/.ssh/config
